<!DOCTYPE html>
<html>
<head>
  <title>Workspace</title>
  <style>
    body {
      margin: 0;
      background: #020617;
      color: white;
      font-family: Arial;
    }
    #apps {
      display: grid;
      grid-template-columns: repeat(auto-fill, 150px);
      gap: 20px;
      padding: 40px;
    }
    .app {
      background: #1e293b;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      border-radius: 10px;
    }
    .app:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <!-- SIGNUP -->
  <div id="signup" hidden></div>

  <!-- WAITING SCREEN -->
  <div id="waiting">
    <h2>Waiting for teacher to start session…</h2>
  </div>

  <!-- SESSION OFFER -->
  <div id="session-offer" hidden></div>

  <!-- WORKSPACE -->
  <div id="workspace" hidden>
    <h2>Classroom Workspace</h2>
    <div id="apps"></div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
