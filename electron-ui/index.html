<!DOCTYPE html>
<html>
<head>
  <title>Student Workspace</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- UTILITY CLASSES --- */
    .hidden { display: none !important; }
    
    .center-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }

    /* --- 1. SIGNUP SCREEN --- */
    #signup-card {
      background: rgba(30, 41, 59, 0.8);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    input {
      padding: 12px;
      margin: 10px 0;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }
    button.primary {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }
    button.primary:hover { background: #2563eb; }

    /* --- 2. WAITING SCREEN --- */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* --- 3. SESSION OFFER SCREEN --- */
    #session-offer {
      background: rgba(15, 23, 42, 0.95);
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 50;
    }

    .offer-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #475569;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
    
    .btn-accept { background: #10b981; color: white; padding: 12px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    .btn-decline { background: #ef4444; color: white; padding: 12px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }

    /* --- 4. WORKSPACE SCREEN --- */
    #workspace {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    #apps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .app {
      background: #334155;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .app:hover { transform: translateY(-2px); background: #475569; }
    .app-disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
    .app-icon { font-size: 32px; margin-bottom: 10px; }
    
    /* 🆕 Exit Button Style */
    .btn-exit-app {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-exit-app:hover { background: #b91c1c; }
    
  </style>
</head>
<body>

  <div id="signup" class="center-screen hidden">
    <div id="signup-card">
      <h2>Welcome Student</h2>
      <p>Enter your details to register this device.</p>
      <input type="text" id="usn-input" placeholder="Enter USN (e.g. 4SO21CS001)" />
      <input type="text" id="name-input" placeholder="Enter Full Name" />
      <button id="signup-btn" class="primary">Register Device</button>
    </div>
  </div>

  <div id="waiting" class="center-screen hidden">
    <div class="loader"></div>
    <h2>Waiting for Session...</h2>
    <p style="color: #94a3b8">Teacher has not started a session yet.</p>
    <p id="student-identity" style="margin-top: 20px; font-family: monospace; color: #64748b"></p>
    <button id="exit-waiting-btn" class="btn-exit-app" style="margin-top: 30px;">Close Application</button>
  </div>

  <div id="session-offer" class="center-screen hidden"></div>

  <div id="workspace" class="hidden">
    <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px;">
      <h2 style="margin:0">Exam Workspace</h2>
      <div style="display: flex; align-items: center; gap: 20px;">
        <div id="timer" style="font-weight: bold; color: #fbbf24;">00:00</div>
        <button id="exit-app-btn" class="btn-exit-app hidden">Exit App</button>
      </div>
    </header>
    <div id="apps"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
